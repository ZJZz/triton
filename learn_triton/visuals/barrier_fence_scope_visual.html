<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrier / Fence Scope Visual</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef3f8;
    --panel: #ffffff;
    --panel-2: #f4f7fb;
    --line: #d7e0ea;
    --ink: #17202f;
    --muted: #5d6b7f;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --teal: #0f8a8a;
    --teal-soft: #d7f5f2;
    --green: #16794d;
    --green-soft: #daf5e6;
    --amber: #b7791f;
    --amber-soft: #fff1d6;
    --rose: #b42318;
    --rose-soft: #fee4e2;
    --violet: #6d4aff;
    --violet-soft: #ece7ff;
    --slate: #475569;
    --slate-soft: #ebf0f6;
    --shadow: 0 16px 40px rgba(24, 39, 75, 0.08);
    --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    font-family: var(--font);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #ffffff, #eaf0f7);
  }

  .header-top {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }

  h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.2px;
  }

  .header-copy {
    color: var(--muted);
    font-size: 12.5px;
    flex: 1 1 280px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 6px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .tab:hover {
    border-color: #a8b7ca;
    transform: translateY(-1px);
  }

  .tab.active {
    border-color: var(--blue);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.18);
  }

  .tab-num {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: #e5ebf3;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    flex: none;
  }

  .tab.active .tab-num {
    background: var(--blue);
    color: #ffffff;
  }

  .tab-title {
    font-size: 13px;
    font-weight: 700;
  }

  .tab-sub {
    color: var(--muted);
    font-size: 11px;
  }

  .stage-copy {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
  }

  .stage-copy strong {
    color: var(--ink);
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }

  .left-region {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .top-row {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 8px;
  }

  .panel {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .combo {
    flex: 1;
    min-width: 0;
  }

  .combo-body {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  .sub-flow {
    flex: 0 0 42%;
    border-right: 1px dashed var(--line);
  }

  .sub-scope {
    flex: 1;
  }

  .panel-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12.5px;
    font-weight: 700;
    flex: none;
  }

  .panel-tag {
    font-size: 10.5px;
    font-weight: 800;
    color: #ffffff;
    background: var(--blue);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .panel-hint {
    margin-left: auto;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
  }

  .panel-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
  }

  .sub-flow .panel-body,
  .sub-scope .panel-body {
    padding: 10px;
  }

  .flow-summary {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    margin-bottom: 8px;
  }

  .legend-item {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 700;
  }

  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    border: 1px solid rgba(23, 32, 47, 0.08);
  }

  .flow-wrap,
  .scope-wrap {
    border: 1px solid #e4ebf3;
    border-radius: 10px;
    background: #fbfdff;
    padding: 6px;
  }

  .flow-wrap svg,
  .scope-card svg,
  #timelineSvg {
    display: block;
    width: 100%;
    height: auto;
  }

  .scope-grid {
    display: grid;
    gap: 10px;
  }

  .scope-header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .scope-header strong {
    font-size: 13px;
  }

  .scope-badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
  }

  .scope-badge.blue { background: var(--blue-soft); color: var(--blue); }
  .scope-badge.green { background: var(--green-soft); color: var(--green); }
  .scope-badge.amber { background: var(--amber-soft); color: var(--amber); }
  .scope-badge.rose { background: var(--rose-soft); color: var(--rose); }
  .scope-badge.violet { background: var(--violet-soft); color: var(--violet); }

  .scope-card {
    border: 1px solid #e4ebf3;
    border-radius: 10px;
    background: #ffffff;
    padding: 10px;
  }

  .scope-card-head {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .scope-card-title {
    font-size: 12.5px;
    font-weight: 800;
  }

  .scope-card-note {
    color: var(--muted);
    font-size: 11px;
  }

  .timeline {
    flex: none;
    height: 338px;
  }

  .timeline-head {
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    flex: none;
  }

  .timeline-title {
    font-size: 12.5px;
    font-weight: 700;
  }

  .btn {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #ffffff;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    min-height: 32px;
    padding: 0 12px;
    cursor: pointer;
  }

  .btn:hover {
    border-color: #9fb1c7;
  }

  .btn.play {
    background: var(--blue);
    color: #ffffff;
    border-color: var(--blue);
  }

  .timeline-meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 11.5px;
  }

  .timeline-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px;
  }

  .timeline-foot {
    padding: 6px 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    background: #fbfdff;
  }

  .code-panel {
    flex: 0 0 32%;
    min-width: 360px;
  }

  .explain {
    padding: 10px 12px;
    background: #eef6ff;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.6;
  }

  .explain strong {
    color: #11305c;
  }

  .meta-rows {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    margin-top: 8px;
  }

  .meta-pill {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    border: 1px solid transparent;
  }

  .meta-pill.blue { background: var(--blue-soft); color: var(--blue); }
  .meta-pill.green { background: var(--green-soft); color: var(--green); }
  .meta-pill.amber { background: var(--amber-soft); color: var(--amber); }
  .meta-pill.rose { background: var(--rose-soft); color: var(--rose); }
  .meta-pill.violet { background: var(--violet-soft); color: var(--violet); }
  .meta-pill.slate { background: var(--slate-soft); color: var(--slate); }

  .narrative {
    padding: 8px 12px;
    background: #fffaf2;
    border-bottom: 1px solid var(--line);
    color: #674700;
    font-size: 11.5px;
    line-height: 1.5;
  }

  .codewrap {
    padding: 8px;
  }

  .cblock {
    border: 1px solid #e4ebf3;
    border-radius: 10px;
    overflow: hidden;
    background: #ffffff;
    margin-bottom: 10px;
  }

  .cbhead {
    padding: 6px 10px;
    border-bottom: 1px solid #e4ebf3;
    background: #f6f9fd;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    font-weight: 700;
  }

  .cbtone {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex: none;
  }

  .cbnote {
    margin-left: auto;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
  }

  pre {
    margin: 0;
    padding: 4px 0;
    font-family: "Cascadia Code", Consolas, Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .cl {
    white-space: pre;
    padding: 1px 12px 1px 14px;
    border-left: 3px solid transparent;
    color: #344256;
  }

  .cl.on {
    background: #fff3d2;
    border-left-color: var(--amber);
    color: #17202f;
    font-weight: 700;
  }

  .kw { color: #b42318; }
  .fn { color: #0550ae; }
  .cm { color: #8693a5; }
  .st { color: #0a6e3b; }
  .nm { color: #7c3aed; }

  @media (max-width: 1220px) {
    main {
      flex-direction: column;
    }

    .code-panel {
      min-width: 0;
      flex: none;
    }
  }

  @media (max-width: 900px) {
    .combo-body {
      flex-direction: column;
    }

    .sub-flow {
      border-right: 0;
      border-bottom: 1px dashed var(--line);
    }
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Barrier / Fence 协议可视化</h1>
    <div class="tabs" id="tabs"></div>
    <div class="header-copy" id="headerCopy"></div>
  </div>
  <div class="stage-copy">
    <span class="chip" id="scopeChip"></span>
    <span class="chip" id="waitChip"></span>
    <span class="chip" id="asyncChip"></span>
    <span id="stageDesc"></span>
  </div>
</header>

<main>
  <div class="left-region">
    <div class="top-row">
      <div class="panel combo">
        <div class="panel-head">
          <span class="panel-tag">视角 1·2</span>
          协议链条与同步层级
          <span class="panel-hint">左边看 data / engine / wait / consumer，右边看 barrier 等待时的 scope-specific fan-in / fan-out</span>
        </div>
        <div class="combo-body">
          <div class="sub-flow">
            <div class="panel-body">
              <div class="flow-summary" id="flowSummary"></div>
              <div class="legend" id="legend"></div>
              <div class="flow-wrap" id="flowPanel"></div>
            </div>
          </div>
          <div class="sub-scope">
            <div class="panel-body">
              <div class="scope-header">
                <strong id="scopeTitle"></strong>
                <span class="scope-badge blue" id="scopeBadge"></span>
              </div>
              <div class="scope-card-note" id="scopeSummary"></div>
              <div class="scope-grid" id="scopePanel" style="margin-top:10px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel timeline">
      <div class="timeline-head">
        <span class="timeline-title">视角 3 · 异步时间线</span>
        <button class="btn play" id="playBtn" type="button">▶ 播放</button>
        <button class="btn" id="prevBtn" type="button">◀</button>
        <button class="btn" id="nextBtn" type="button">▶</button>
        <button class="btn" id="resetBtn" type="button">⟲</button>
        <span class="timeline-meta" id="timelineMeta"></span>
      </div>
      <div class="timeline-body">
        <svg id="timelineSvg" viewBox="0 0 1200 280" role="img" aria-label="Protocol timeline"></svg>
      </div>
      <div class="timeline-foot" id="timelineFoot"></div>
    </div>
  </div>

  <div class="panel code-panel">
    <div class="panel-head">
      <span class="panel-tag">视角 4</span>
      当前步骤、伪代码与误区
      <span class="panel-hint">高亮行 = 当前阶段真正起作用的那条同步边</span>
    </div>
    <div class="explain" id="explain"></div>
    <div class="narrative" id="narrative"></div>
    <div class="panel-body">
      <div class="codewrap" id="codePanel"></div>
    </div>
  </div>
</main>

<script>
const COLORS = {
  source: { fill: '#dbeafe', stroke: '#2563eb', ink: '#1d4ed8' },
  engine: { fill: '#d7f5f2', stroke: '#0f8a8a', ink: '#0f6f70' },
  output: { fill: '#ece7ff', stroke: '#6d4aff', ink: '#5b34db' },
  sync: { fill: '#fff1d6', stroke: '#b7791f', ink: '#8e5e12' },
  consumer: { fill: '#e6effa', stroke: '#4b6b94', ink: '#365173' },
  hazard: { fill: '#fee4e2', stroke: '#b42318', ink: '#9a2015' },
  thread: { fill: '#dbeafe', stroke: '#2563eb', ink: '#1d4ed8' },
  warp: { fill: '#d7f5f2', stroke: '#0f8a8a', ink: '#0f6f70' },
  cta: { fill: '#daf5e6', stroke: '#16794d', ink: '#12603d' },
  cluster: { fill: '#ece7ff', stroke: '#6d4aff', ink: '#5b34db' },
  wg: { fill: '#fff1d6', stroke: '#b7791f', ink: '#8e5e12' },
};

function esc(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function fmtTone(tone) {
  return COLORS[tone] || COLORS.source;
}

const SCENARIOS = [
  {
    id: 'warp',
    short: 'Warp',
    title: 'Warp 级 rendezvous',
    subtitle: '单个 warp 的 32 lanes 先各做一段工作，再通过 `bar.warp.sync` reconverge。这里的 fan-in / fan-out 只发生在 warp 内部。',
    headerCopy: '这页把“当前同步到底管到哪一层”直接画出来。切换场景后，右上角会把等待点的参与者换成 thread / warp / CTA / cluster / warp-group 视角。',
    scopeChip: '当前主同步层级：warp（32 lanes）',
    waitChip: 'wait object：bar.warp.sync',
    asyncChip: '异步性：无独立异步引擎，重点是执行会合',
    flowSummary: '目标不是等待某个 copy engine 完成，而是把一个 warp 里发生分歧的 lanes 再次对齐，让后续寄存器 / shared 使用边界成立。',
    scopeTitle: 'Warp fan-in / fan-out',
    scopeBadge: { text: 'scope = warp', cls: 'blue' },
    scopeSummary: '当当前同步是 warp 级时，只画这 32 个 lanes。其它 warps、其它 CTA 都不会出现在 fan-in / fan-out 图里。',
    timelineFoot: '这里没有独立硬件异步引擎；时间线上强调的是“同一 warp 的 lanes 在不同分支里先散开，再在 barrier 处收敛”。',
    flow: {
      width: 620,
      height: 360,
      nodes: [
        { id: 'laneWork', x: 34, y: 146, w: 148, h: 74, label: 'lane-local work', sub: 'predicated branch', tone: 'source' },
        { id: 'diverge', x: 222, y: 82, w: 136, h: 64, label: 'divergent path A', sub: 'lanes 0..15', tone: 'engine' },
        { id: 'divergeB', x: 222, y: 216, w: 136, h: 64, label: 'divergent path B', sub: 'lanes 16..31', tone: 'engine' },
        { id: 'barrier', x: 404, y: 148, w: 150, h: 72, label: 'bar.warp.sync', sub: 'warp rendezvous', tone: 'sync' },
        { id: 'next', x: 578, y: 148, w: 150, h: 72, label: 'next warp op', sub: 'reconverged lanes', tone: 'consumer' }
      ],
      edges: [
        { id: 'splitA', from: 'laneWork', to: 'diverge', label: 'lane subset A', tone: 'engine' },
        { id: 'splitB', from: 'laneWork', to: 'divergeB', label: 'lane subset B', tone: 'engine' },
        { id: 'joinA', from: 'diverge', to: 'barrier', label: 'fan-in', tone: 'sync' },
        { id: 'joinB', from: 'divergeB', to: 'barrier', label: 'fan-in', tone: 'sync' },
        { id: 'fanout', from: 'barrier', to: 'next', label: 'fan-out', tone: 'consumer' }
      ]
    },
    scopeSteps: [
      {
        title: '进入 warp barrier 前',
        note: '32 lanes 先各自完成分支内部的工作。',
        barrier: 'bar.warp.sync',
        phase: 'fanin',
        left: { kind: 'lanes', count: 32, label: 'warp 0 lanes', tone: 'thread' },
        right: { kind: 'lanes', count: 32, label: '下一条 warp 指令', tone: 'consumer' },
        barrierTone: 'sync'
      }
    ],
    codeBlocks: [
      {
        title: 'Warp-local pseudo code',
        tone: 'source',
        note: '重点是 warp 内 reconverge，不是 CTA publish',
        lines: [
          { id: 'W1', html: '<span class="kw">if</span> (<span class="nm">lane_id</span> &lt; 16) { <span class="cm">// path A</span>' },
          { id: 'W2', html: '  <span class="fn">do_path_a</span>();' },
          { id: 'W3', html: '} <span class="kw">else</span> { <span class="cm">// path B</span>' },
          { id: 'W4', html: '  <span class="fn">do_path_b</span>();' },
          { id: 'W5', html: '}' },
          { id: 'W6', html: '<span class="fn">bar_warp_sync</span>(mask);' },
          { id: 'W7', html: '<span class="fn">consume_reconverged_state</span>();' }
        ]
      }
    ],
    timeline: {
      lanes: [
        { id: 'lanesA', label: 'lanes 0..15', note: 'warp half A', bg: '#f8fbff' },
        { id: 'lanesB', label: 'lanes 16..31', note: 'warp half B', bg: '#f8fbff' },
        { id: 'sync', label: 'bar.warp.sync', note: 'warp rendezvous', bg: '#fffaf2' },
        { id: 'next', label: 'next op', note: 'reconverged', bg: '#f6fbf8' }
      ],
      events: [
        { lane: 'lanesA', start: 0, end: 2.4, label: 'path A work', tone: 'engine' },
        { lane: 'lanesB', start: 0.4, end: 3.2, label: 'path B work', tone: 'engine' },
        { lane: 'sync', start: 3.2, end: 4.2, label: 'wait all lanes', tone: 'sync' },
        { lane: 'next', start: 4.2, end: 5.1, label: 'reconverged op', tone: 'consumer' }
      ]
    },
    steps: [
      {
        label: 'lane divergence',
        explain: '同一个 warp 的 lanes 分别跑 path A / path B。还没有形成公共可继续点。',
        insight: '这里只是执行分歧，跟异步 copy / completion tracking 无关。',
        code: ['W1', 'W2', 'W3', 'W4'],
        scopeRefs: [0],
        activeNodes: ['laneWork', 'diverge', 'divergeB'],
        activeEdges: ['splitA', 'splitB'],
        timelineTick: 1.8,
        meta: [
          { text: 'scope: warp', cls: 'blue' },
          { text: 'kind: rendezvous', cls: 'amber' },
          { text: 'async engine: none', cls: 'slate' }
        ]
      },
      {
        label: 'warp fan-in',
        explain: '32 lanes 向 `bar.warp.sync` 收敛。等待点只看这个 warp，不关心 CTA 内其它 warps。',
        insight: '你看到的 inward arrows 就是 warp 内线程的 fan-in；这正是用户关心的“如果当前同步是 warp 级，就只展示 warp 内线程”的情况。',
        code: ['W6'],
        scopeRefs: [0],
        activeNodes: ['diverge', 'divergeB', 'barrier'],

    timeline: {

        { id: 'tmem', label: 'TMEM state', note: 'result arrives after completion', bg: '#faf7ff' },

      events: [

        { lane: 'wait', start: 5.7, end: 6.6, label: 'CTA hazard barrier', tone: 'hazard' },

    steps: [

        scopeRefs: [0],

        activeEdges: ['complete', 'observe'],

        activeEdges: ['repair'],

        activeEdges: ['fanout', 'consume'],
        timelineTick: 7.0,
        meta: [

const state = {
  scenarioIndex: 0,
  stepIndex: 0,
  timer: null
};

const tabsEl = document.getElementById('tabs');
const headerCopyEl = document.getElementById('headerCopy');
const scopeChipEl = document.getElementById('scopeChip');
const waitChipEl = document.getElementById('waitChip');
const asyncChipEl = document.getElementById('asyncChip');
const stageDescEl = document.getElementById('stageDesc');
const flowSummaryEl = document.getElementById('flowSummary');
const legendEl = document.getElementById('legend');
const flowPanelEl = document.getElementById('flowPanel');
const scopeTitleEl = document.getElementById('scopeTitle');
const scopeBadgeEl = document.getElementById('scopeBadge');
const scopeSummaryEl = document.getElementById('scopeSummary');
const scopePanelEl = document.getElementById('scopePanel');
const explainEl = document.getElementById('explain');
const narrativeEl = document.getElementById('narrative');
const codePanelEl = document.getElementById('codePanel');
const timelineSvgEl = document.getElementById('timelineSvg');
const timelineMetaEl = document.getElementById('timelineMeta');
const timelineFootEl = document.getElementById('timelineFoot');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');

function currentScenario() {
  return SCENARIOS[state.scenarioIndex];
}

function currentStep() {
  return currentScenario().steps[state.stepIndex];
}

function buildTabs() {
  tabsEl.innerHTML = SCENARIOS.map((scenario, index) => `
    <button class="tab ${index === state.scenarioIndex ? 'active' : ''}" data-index="${index}" type="button">
      <span class="tab-num">${index + 1}</span>
      <span>
        <span class="tab-title">${esc(scenario.title)}</span><br>
        <span class="tab-sub">${esc(scenario.short)}</span>
      </span>
    </button>
  `).join('');
  tabsEl.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      stopPlayback();
      state.scenarioIndex = Number(tab.dataset.index);
      state.stepIndex = 0;
      render();
    });
  });
}

function renderHeader() {
  const scenario = currentScenario();
  const step = currentStep();
  document.title = `${scenario.title} · Barrier / Fence Scope Visual`;
  headerCopyEl.textContent = scenario.headerCopy;
  scopeChipEl.textContent = scenario.scopeChip;
  waitChipEl.textContent = scenario.waitChip;
  asyncChipEl.textContent = scenario.asyncChip;
  stageDescEl.innerHTML = `<strong>${esc(step.label)}</strong>：${esc(step.explain)}`;
}

function renderLegend() {
  const items = [
    { label: 'source / initiator', tone: 'source' },
    { label: 'async engine', tone: 'engine' },
    { label: 'destination state', tone: 'output' },
    { label: 'wait / barrier', tone: 'sync' },
    { label: 'consumer / release', tone: 'consumer' },
    { label: 'hazard repair', tone: 'hazard' }
  ];
  legendEl.innerHTML = items.map((item) => {
    const c = fmtTone(item.tone);
    return `<span class="legend-item"><span class="legend-swatch" style="background:${c.fill}"></span>${esc(item.label)}</span>`;
  }).join('');
}

function renderFlow() {
  const scenario = currentScenario();
  const step = currentStep();
  const nodeMap = Object.fromEntries(scenario.flow.nodes.map((node) => [node.id, node]));
  const activeNodes = new Set(step.activeNodes);
  const activeEdges = new Set(step.activeEdges);
  flowSummaryEl.textContent = scenario.flowSummary;

  const svg = [];
  svg.push(`<svg viewBox="0 0 ${scenario.flow.width} ${scenario.flow.height}" role="img" aria-label="${esc(scenario.title)} flow">`);
  svg.push(flowDefs());

  scenario.flow.edges.forEach((edge) => {
    const from = nodeMap[edge.from];
    const to = nodeMap[edge.to];
    const sx = from.x + from.w;
    const sy = from.y + from.h / 2;
    const tx = to.x;
    const ty = to.y + to.h / 2;
    const mx = (sx + tx) / 2;
    const active = activeEdges.has(edge.id);
    const tone = fmtTone(edge.tone);
    svg.push(`
      <path d="M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}" fill="none"
        stroke="${active ? tone.stroke : '#c4cedb'}" stroke-width="${active ? 3 : 2}"
        marker-end="url(#arrow-${active ? 'active' : 'idle'})"
        opacity="${active ? 1 : 0.8}"></path>
      <rect x="${mx - 48}" y="${((sy + ty) / 2) - 11}" width="96" height="22" rx="11" fill="#ffffff" stroke="#dbe4ee"></rect>
      <text x="${mx}" y="${((sy + ty) / 2) + 4}" text-anchor="middle" fill="${active ? tone.ink : '#708094'}" font-size="11.5" font-weight="800">${esc(edge.label)}</text>
    `);
  });

  scenario.flow.nodes.forEach((node) => {
    const c = fmtTone(node.tone);
    const active = activeNodes.has(node.id);
    svg.push(`
      <rect x="${node.x}" y="${node.y}" width="${node.w}" height="${node.h}" rx="14"
        fill="${c.fill}" stroke="${active ? c.stroke : '#c8d2df'}" stroke-width="${active ? 3 : 1.6}"
        opacity="${active ? 1 : 0.86}"></rect>
      <text x="${node.x + 14}" y="${node.y + 28}" fill="${c.ink}" font-size="13" font-weight="800">${esc(node.label)}</text>
      <text x="${node.x + 14}" y="${node.y + 46}" fill="#5d6b7f" font-size="11.5">${esc(node.sub)}</text>
    `);
  });

  svg.push(`</svg>`);
  flowPanelEl.innerHTML = svg.join('');
}

function renderScope() {
  const scenario = currentScenario();
  const step = currentStep();
  scopeTitleEl.textContent = scenario.scopeTitle;
  scopeBadgeEl.textContent = scenario.scopeBadge.text;
  scopeBadgeEl.className = `scope-badge ${scenario.scopeBadge.cls}`;
  scopeSummaryEl.textContent = scenario.scopeSummary;

  scopePanelEl.innerHTML = step.scopeRefs.map((ref) => {
    const card = scenario.scopeSteps[ref];
    return `
      <div class="scope-card">
        <div class="scope-card-head">
          <span class="scope-card-title">${esc(card.title)}</span>
          <span class="scope-badge ${card.barrierTone === 'hazard' ? 'rose' : card.left.tone === 'cluster' ? 'violet' : card.left.tone === 'cta' ? 'green' : card.left.tone === 'wg' ? 'amber' : 'blue'}">${esc(card.barrier)}</span>
        </div>
        <div class="scope-card-note">${esc(card.note)}</div>
        ${buildScopeSvg(card)}
      </div>
    `;
  }).join('');
}

function buildScopeSvg(card) {
  const width = 560;
  const height = 190;
  const leftX = 74;
  const rightX = 458;
  const barrierX = 282;
  const centerY = 104;
  const barrierTone = fmtTone(card.barrierTone || 'sync');

  const left = drawGroup(card.left, leftX, centerY);
  const right = drawGroup(card.right, rightX, centerY);
  const inwardStroke = barrierTone.stroke;
  const outwardStroke = fmtTone('consumer').stroke;

  return `
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(card.title)}">
      <defs>
        <marker id="scope-in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 z" fill="${inwardStroke}"></path>
        </marker>
        <marker id="scope-out" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 z" fill="${outwardStroke}"></path>
        </marker>
      </defs>
      <rect x="0.5" y="0.5" width="${width - 1}" height="${height - 1}" rx="14" fill="#fbfdff" stroke="#e2e8f0"></rect>
      ${left.svg}
      ${right.svg}
      <path d="M ${left.anchorX} ${left.anchorY} C ${left.anchorX + 80} ${left.anchorY}, ${barrierX - 52} ${centerY}, ${barrierX - 18} ${centerY}"
        fill="none" stroke="${inwardStroke}" stroke-width="2.6" marker-end="url(#scope-in)"></path>
      <path d="M ${barrierX + 18} ${centerY} C ${barrierX + 54} ${centerY}, ${right.anchorX - 80} ${right.anchorY}, ${right.anchorX} ${right.anchorY}"
        fill="none" stroke="${outwardStroke}" stroke-width="2.6" marker-end="url(#scope-out)"></path>
      <rect x="${barrierX - 70}" y="${centerY - 34}" width="140" height="68" rx="18" fill="${barrierTone.fill}" stroke="${barrierTone.stroke}" stroke-width="2.4"></rect>
      <text x="${barrierX}" y="${centerY - 2}" text-anchor="middle" fill="${barrierTone.ink}" font-size="13" font-weight="800">${esc(card.barrier)}</text>
      <text x="${barrierX}" y="${centerY + 18}" text-anchor="middle" fill="#5d6b7f" font-size="11.5">fan-in 观察点 → fan-out release</text>
      <text x="${barrierX}" y="28" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="700">当前同步层级决定参与者集合</text>
    </svg>
  `;
}

function drawGroup(group, cx, cy) {
  const tone = fmtTone(group.tone);
  let svg = '';
  let anchorX = cx;
  const anchorY = cy;

  if (group.kind === 'thread') {
    svg += `<circle cx="${cx}" cy="${cy}" r="18" fill="${tone.fill}" stroke="${tone.stroke}" stroke-width="2.2"></circle>`;
    svg += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="${tone.ink}" font-size="11" font-weight="800">T</text>`;
  } else if (group.kind === 'lanes') {
    const startX = cx - 46;
    const startY = cy - 34;
    for (let row = 0; row < 4; row += 1) {
      for (let col = 0; col < 8; col += 1) {
        const x = startX + col * 13;
        const y = startY + row * 14;
        svg += `<circle cx="${x}" cy="${y}" r="4.3" fill="${tone.fill}" stroke="${tone.stroke}" stroke-width="1.2"></circle>`;
      }
    }
  } else if (group.kind === 'warps' || group.kind === 'warpgroup') {
    const count = group.count;
    const rows = count > 2 ? 2 : 1;
    const cols = rows === 1 ? count : 2;
    const startX = cx - (cols === 1 ? 0 : 54);
    const startY = cy - (rows === 1 ? 18 : 36);
    let idx = 0;
    for (let row = 0; row < rows; row += 1) {
      for (let col = 0; col < cols; col += 1) {
        if (idx >= count) break;
        const x = startX + col * 56;
        const y = startY + row * 40;
        svg += `<rect x="${x}" y="${y}" width="40" height="24" rx="8" fill="${tone.fill}" stroke="${tone.stroke}" stroke-width="1.8"></rect>`;
        svg += `<text x="${x + 20}" y="${y + 16}" text-anchor="middle" fill="${tone.ink}" font-size="10.5" font-weight="800">w${idx}</text>`;
        idx += 1;
      }
    }
  } else if (group.kind === 'ctas') {
    const startX = cx - 62;
    for (let i = 0; i < group.count; i += 1) {
      const boxX = startX + i * 74;
      svg += `<rect x="${boxX}" y="${cy - 40}" width="58" height="58" rx="12" fill="${tone.fill}" stroke="${tone.stroke}" stroke-width="2"></rect>`;
      svg += `<text x="${boxX + 29}" y="${cy - 16}" text-anchor="middle" fill="${tone.ink}" font-size="11.5" font-weight="800">CTA${i}</text>`;
      for (let j = 0; j < 4; j += 1) {
        const wx = boxX + 10 + (j % 2) * 20;
        const wy = cy + 2 + Math.floor(j / 2) * 14;
        svg += `<rect x="${wx}" y="${wy}" width="16" height="10" rx="4" fill="#ffffff" stroke="${tone.stroke}" stroke-width="1"></rect>`;
      }
    }
  }

  svg += `<text x="${cx}" y="${cy + 62}" text-anchor="middle" fill="${tone.ink}" font-size="11.5" font-weight="800">${esc(group.label)}</text>`;
  anchorX = cx + (cx < 280 ? 54 : -54);
  return { svg, anchorX, anchorY };
}

function renderCode() {
  const scenario = currentScenario();
  const step = currentStep();
  const active = new Set(step.code);

  explainEl.innerHTML = `
    <strong>${esc(step.label)}</strong><br>
    ${esc(step.explain)}
    <div class="meta-rows">
      ${step.meta.map((item) => `<span class="meta-pill ${item.cls}">${esc(item.text)}</span>`).join('')}
    </div>
  `;
  narrativeEl.textContent = step.insight;

  codePanelEl.innerHTML = scenario.codeBlocks.map((block) => {
    const tone = fmtTone(block.tone);
    return `
      <div class="cblock">
        <div class="cbhead">
          <span class="cbtone" style="background:${tone.fill}"></span>
          <span>${esc(block.title)}</span>
          <span class="cbnote">${esc(block.note)}</span>
        </div>
        <pre>${block.lines.map((line) => `<div class="cl ${active.has(line.id) ? 'on' : ''}">${line.html}</div>`).join('')}</pre>
      </div>
    `;
  }).join('');
}

function renderTimeline() {
  const scenario = currentScenario();
  const step = currentStep();
  const ticks = Math.max(...scenario.timeline.events.map((event) => event.end)) + 0.5;
  const laneGap = 52;
  const left = 168;
  const top = 44;
  const width = 1160;
  const innerWidth = 920;
  const tickX = (v) => left + (v / ticks) * innerWidth;
  const height = top + laneGap * scenario.timeline.lanes.length + 28;
  timelineSvgEl.setAttribute('viewBox', `0 0 ${width} ${height}`);
  timelineMetaEl.textContent = `step ${state.stepIndex + 1} / ${scenario.steps.length} · playhead ${step.timelineTick.toFixed(1)}`;
  timelineFootEl.textContent = scenario.timelineFoot;

  const svg = [];
  svg.push(flowDefs());
  svg.push(`<rect x="0.5" y="0.5" width="${width - 1}" height="${height - 1}" rx="18" fill="#ffffff" stroke="#e4ebf3"></rect>`);
  for (let i = 0; i <= Math.floor(ticks); i += 1) {
    const x = tickX(i);
    svg.push(`<line x1="${x}" y1="${top - 12}" x2="${x}" y2="${height - 18}" stroke="#dbe3ed" stroke-width="1.2"></line>`);
    svg.push(`<text x="${x}" y="22" text-anchor="middle" fill="#7a8799" font-size="10.5" font-weight="700">t${i}</text>`);
  }

  scenario.timeline.lanes.forEach((lane, laneIndex) => {
    const y = top + laneIndex * laneGap;
    svg.push(`<rect x="18" y="${y - 20}" width="${width - 36}" height="40" rx="12" fill="${lane.bg}" stroke="#e4ebf3"></rect>`);
    svg.push(`<text x="32" y="${y - 3}" fill="#17202f" font-size="12.5" font-weight="800">${esc(lane.label)}</text>`);
    svg.push(`<text x="32" y="${y + 12}" fill="#7a8799" font-size="10.5">${esc(lane.note)}</text>`);
  });

  scenario.timeline.events.forEach((event) => {
    const laneIndex = scenario.timeline.lanes.findIndex((lane) => lane.id === event.lane);
    const y = top + laneIndex * laneGap - 12;
    const x = tickX(event.start);
    const w = Math.max(42, tickX(event.end) - x);
    const c = fmtTone(event.tone);
    const active = step.timelineTick >= event.start && step.timelineTick <= event.end + 0.05;
    svg.push(`
      <rect x="${x}" y="${y}" width="${w}" height="24" rx="8"
        fill="${c.fill}" stroke="${active ? c.stroke : '#bfcbd8'}" stroke-width="${active ? 2.4 : 1.3}"
        opacity="${active ? 1 : 0.9}"></rect>
      <text x="${x + 8}" y="${y + 16}" fill="${active ? c.ink : '#49586b'}" font-size="11" font-weight="800">${esc(event.label)}</text>
    `);
  });

  const playX = tickX(step.timelineTick);
  svg.push(`<line x1="${playX}" y1="${top - 16}" x2="${playX}" y2="${height - 16}" stroke="#b42318" stroke-width="3"></line>`);
  svg.push(`<circle cx="${playX}" cy="${top - 16}" r="6" fill="#b42318"></circle>`);

  timelineSvgEl.innerHTML = svg.join('');
}

function flowDefs() {
  return `
    <defs>
      <marker id="arrow-active" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748b"></path>
      </marker>
      <marker id="arrow-idle" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M 0 0 L 8 4 L 0 8 z" fill="#c4cedb"></path>
      </marker>
    </defs>
  `;
}

function render() {
  buildTabs();
  renderHeader();
  renderLegend();
  renderFlow();
  renderScope();
  renderCode();
  renderTimeline();
}

function stopPlayback() {
  if (state.timer) {
    window.clearInterval(state.timer);
    state.timer = null;
  }
  playBtn.textContent = '▶ 播放';
}

function playPlayback() {
  if (state.timer) {
    stopPlayback();
    return;
  }
  playBtn.textContent = '⏸ 暂停';
  state.timer = window.setInterval(() => {
    const scenario = currentScenario();
    if (state.stepIndex >= scenario.steps.length - 1) {
      stopPlayback();
      return;
    }
    state.stepIndex += 1;
    render();
  }, 1650);
}

playBtn.addEventListener('click', playPlayback);
prevBtn.addEventListener('click', () => {
  stopPlayback();
  state.stepIndex = Math.max(0, state.stepIndex - 1);
  render();
});
nextBtn.addEventListener('click', () => {
  stopPlayback();
  state.stepIndex = Math.min(currentScenario().steps.length - 1, state.stepIndex + 1);
  render();
});
resetBtn.addEventListener('click', () => {
  stopPlayback();
  state.stepIndex = 0;
  render();
});

render();
</script>
